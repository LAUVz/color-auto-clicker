name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-native:
    name: Build Windows Native (C++)
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup MSVC
        uses: microsoft/setup-msbuild@v2

      - name: Setup Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Compile resources
        run: rc.exe /nologo app.rc

      - name: Build C++ Native
        run: cl.exe main.cpp app.res /EHsc /std:c++17 /D_UNICODE /DUNICODE /Fe:ColorClicker.exe /link user32.lib gdi32.lib gdiplus.lib comctl32.lib /SUBSYSTEM:WINDOWS /ENTRY:wWinMainCRTStartup /nologo

      - name: Rename C++ executable
        run: mv ColorClicker.exe Windows-ColorClicker-Native.exe
        shell: bash

      - name: Upload Native Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-build
          path: Windows-ColorClicker-Native.exe
          retention-days: 30

  build-windows-electron:
    name: Build Windows Electron
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python for node-gyp
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python setuptools
        run: pip install setuptools

      - name: Install dependencies
        run: npm install

      - name: Build TypeScript
        run: npm run build

      - name: Build Windows Electron portable
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Electron Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-electron-build
          path: release/win-*-ColorClicker-*.exe
          retention-days: 30

  build-macos:
    name: Build macOS
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Build TypeScript
        run: npm run build

      - name: Build macOS (Intel + Apple Silicon)
        run: npm run dist:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: release/mac-*-ColorClicker-*.zip
          retention-days: 30

  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev libpng-dev

      - name: Install dependencies
        run: npm install

      - name: Build TypeScript
        run: npm run build

      - name: Build Linux (x64 + ARM64)
        run: npm run dist:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: |
            release/linux-*-ColorClicker-*.AppImage
            release/linux-*-ColorClicker-*.deb
          retention-days: 30

  create-release:
    name: Create GitHub Release
    needs: [build-windows-native, build-windows-electron, build-macos, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/windows-native-build/*
            artifacts/windows-electron-build/*
            artifacts/macos-build/*
            artifacts/linux-build/*
          body: |
            ## Color Auto-Clicker ${{ github.ref_name }}

            ### Downloads
            - **ColorClicker-Native-Windows.exe** - Native C++ version (1.8MB, fastest)
            - **ColorClicker-Electron-Windows.exe** - Electron version (68MB, cross-platform)
            - **ColorClicker.dmg / .zip** - macOS (Intel + Apple Silicon)
            - **ColorClicker.AppImage / .deb** - Linux (x64 + ARM64)

            ### What's New
            - Lightweight color detection and auto-clicker
            - Two modes: Target Color matching and Color Change detection
            - Clean, modern UI with monospace font (Consolas)
            - Global numpad hotkeys (work even when app is not focused)
            - Real-time color preview (updates 20x/second)
            - Auto-stop after click for one-shot detection

            ### Features
            - **Target Color Mode**: Instant color sampling, clicks when target color detected
            - **Color Change Mode**: Clicks when any color change is detected
            - **Global Hotkeys**: Numpad 8 (pick color), Numpad 2 (start/stop), Numpad 0 (quit)
            - **Visual Feedback**: Green START / Red STOP button with audio confirmations
            - **Always on top**: Easy access while using other apps

            ### System Requirements
            - **Windows Native**: Windows Vista or later, no dependencies
            - **Electron**: Windows 10+, macOS 10.13+, Linux (modern distros)
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
